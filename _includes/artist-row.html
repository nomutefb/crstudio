{% assign a = include.artist %}
<a class="artist-row" href="{{ a.url | relative_url }}" data-cohort="{{ a.cohort }}">
  <span class="idx">{{ include.idx }}</span>
  <span class="artist-name">{% if a.ename and a.ename != "" %}{{ a.ename }}{% else %}{{ a.title }}{% endif %}</span>
  <span class="artist-meta">
    <span class="kname">{{ a.title }}</span>
    {% if a.genre and a.genre != "" %}<span class="sub">{{ a.genre }}</span>{% endif %}
  </span>
</a>

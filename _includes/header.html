<header class="site-head">
  <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.data.settings.site_name }}{% if site.data.settings.site_name_dot %}<span>.</span>{% endif %}</a>
  <nav class="site-nav">
    <a href="{{ '/artists/' | relative_url }}" {% if page.nav == 'artists' %}class="is-active"{% endif %}>Artists</a>
    <a href="{{ '/projects/' | relative_url }}" {% if page.nav == 'projects' %}class="is-active"{% endif %}>Projects</a>
    <a class="nav-hide-m" href="{{ '/program/' | relative_url }}" {% if page.nav == 'program' %}class="is-active"{% endif %}>Program</a>
    <a class="nav-admin" href="{{ '/admin/' | relative_url }}" title="관리자">Admin</a>
    <button class="nav-burger" type="button" aria-label="메뉴 열기" data-menu-open>Menu</button>
  </nav>
</header>

<div class="mobile-menu" data-mobile-menu aria-hidden="true">
  <button class="mobile-menu-close" type="button" aria-label="메뉴 닫기" data-menu-close>Close</button>
  <p class="label mm-label">{{ site.data.settings.site_name }} — MENU</p>
  <a href="{{ '/' | relative_url }}">Home</a>
  <a href="{{ '/artists/' | relative_url }}">Artists</a>
  <a href="{{ '/projects/' | relative_url }}">Projects</a>
  <a href="{{ '/program/' | relative_url }}">Program</a>
  <a href="{{ '/program/#timeline' | relative_url }}">Calendar — 연혁 캘린더</a>
  <a href="{{ '/admin/' | relative_url }}">Admin</a>
</div>

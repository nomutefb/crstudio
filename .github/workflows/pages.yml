# GitHub Pages 배포
#
# main 에 push 하면 Jekyll 로 빌드해 GitHub Pages 에 올립니다.
#
# baseurl 은 고정값으로 적지 않고 actions/configure-pages 가 알려주는 값을
# 씁니다. 프로젝트 사이트면 "/crstudio", 사용자 사이트면 "" 가 들어가므로
# 저장소 이름이 바뀌어도 링크가 깨지지 않습니다.
#
# 이 워크플로가 동작하려면 저장소 설정에서
#   Settings -> Pages -> Source 를 "GitHub Actions" 로
# 지정해야 합니다. (저장소 소유자만 변경할 수 있습니다)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포를 취소하면 사이트가 잠시 비어
# 보일 수 있으므로 취소하지 않고 줄을 세웁니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Pages 설정 읽기
        id: pages
        uses: actions/configure-pages@v5

      - name: Jekyll 빌드
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: 산출물 점검
        run: |
          test -f _site/index.html || { echo "index.html 이 생성되지 않았습니다"; exit 1; }
          echo "생성된 파일 수: $(find _site -type f | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

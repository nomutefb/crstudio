# ─────────────────────────────────────────────
# Sveltia CMS 설정 — 관리자(/admin) 페이지
# 로그인: "Sign In with Token" → GitHub 토큰 붙여넣기
# ─────────────────────────────────────────────

backend:
  name: github
  repo: nomutefb/crstudio
  branch: main
  automatic_deployments: true

site_url: https://crstudio-3re.pages.dev
display_url: https://crstudio-3re.pages.dev

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: artists
    label: 작가
    label_singular: 작가
    folder: "_artists"
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.ename | default('artist')}}"
    identifier_field: title
    summary: "{{title}} — {{year}} · {{cohort}}기"
    sortable_fields: [cohort, year, title]
    view_groups:
      - label: 기수별
        field: cohort
    fields:
      - { name: title, label: 이름(국문), widget: string, required: true }
      - { name: ename, label: 이름(영문 표기), widget: string, required: false, default: "", hint: "예: KANG UN — 비워두면 국문 이름이 크게 표시됩니다" }
      - { name: cohort, label: 기수, widget: number, value_type: int, min: 1, max: 99, required: true }
      - { name: year, label: 입주 연도, widget: number, value_type: int, min: 2020, max: 2099, required: true }
      - { name: genre, label: 장르/매체, widget: string, required: false, default: "", hint: "예: 회화, 설치, 미디어" }
      - { name: thumb, label: 대표 이미지(프로필/작업), widget: image, required: false, default: "" }
      - { name: ph, label: 기본 플레이스홀더 번호(1–6), widget: number, value_type: int, min: 1, max: 6, default: 1, hint: "대표 이미지가 없을 때 표시되는 기본 그래픽" }
      - name: gallery
        label: 작업 이미지
        widget: list
        required: false
        default: []
        field: { name: image, label: 이미지, widget: image }
      - { name: video, label: 유튜브 영상, widget: string, required: false, default: "", hint: "유튜브 주소를 그대로 붙여넣으세요 (예: https://youtu.be/hRXziUQ5nk0). 비워두면 영상 칸이 표시되지 않습니다" }
      - name: links
        label: 외부 링크
        widget: list
        required: false
        default: []
        fields:
          - { name: label, label: 표시 이름, widget: string }
          - { name: url, label: URL, widget: string }
      - { name: body, label: 소개 글, widget: markdown }

  - name: projects
    label: 게시물
    label_singular: 게시물
    folder: "_projects"
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{fields.title}}"
    summary: "{{title}} — {{category}} · {{date | date('YYYY.MM.DD')}}"
    sortable_fields: [date, title, category]
    view_groups:
      - label: 유형별
        field: category
    fields:
      - { name: title, label: 제목, widget: string, required: true }
      - { name: date, label: 날짜, widget: datetime, format: "YYYY-MM-DD", time_format: false, required: true }
      - { name: category, label: 유형, widget: select, options: ["전시", "프로그램", "소식", "기타"], default: "소식" }
      - name: artists
        label: 참여 작가(이름)
        widget: list
        required: false
        default: []
        field: { name: name, label: 작가 이름, widget: string }
      - { name: place, label: 장소, widget: string, required: false, default: "" }
      - { name: cover, label: 커버 이미지, widget: image, required: false, default: "" }
      - name: gallery
        label: 갤러리 이미지
        widget: list
        required: false
        default: []
        field: { name: image, label: 이미지, widget: image }
      - { name: excerpt_text, label: 요약(목록에 표시), widget: text, required: false, default: "" }
      - { name: body, label: 본문, widget: markdown }

  - name: settings
    label: 사이트 설정
    editor: { preview: false }
    files:
      - name: general
        label: 사이트 문구·정보
        file: "_data/settings.yml"
        fields:
          - { name: site_name, label: 사이트 이름(워드마크), widget: string }
          - { name: site_name_dot, label: "워드마크 끝에 점(.) 표시", widget: boolean, default: true }
          - name: hero
            label: 메인 히어로
            widget: object
            fields:
              - { name: kicker, label: 상단 작은 문구, widget: string }
              - { name: line1, label: 큰 제목 1줄, widget: string }
              - { name: line2, label: 큰 제목 2줄(윤곽선), widget: string }
              - { name: tagline, label: 소개 한 줄, widget: string }
              - { name: marquee, label: 흐르는 띠 문구, widget: string }
          - name: intro
            label: 소개 섹션
            widget: object
            fields:
              - { name: label, label: 섹션 라벨, widget: string }
              - { name: heading, label: 제목, widget: string }
              - { name: paragraphs, label: 문단, widget: list, field: { name: p, label: 문단, widget: text } }
          - name: stats
            label: 숫자 밴드
            widget: list
            fields:
              - { name: num, label: 숫자, widget: string }
              - { name: label, label: 라벨, widget: string }
          - { name: facility, label: 시설 한 줄 소개, widget: string, required: false, default: "" }
          - name: program
            label: 프로그램 아코디언
            widget: list
            fields:
              - { name: title, label: 제목, widget: string }
              - { name: desc, label: 설명, widget: text }
          - name: backcover
            label: 홈 마지막 장(백커버)
            widget: object
            fields:
              - { name: lead, label: "앞 단어(윤곽선)", widget: string, default: "JANGDO" }
              - { name: tail, label: "뒷 단어(채움)", widget: string, default: "CREATIVE STUDIO" }
              - { name: image, label: 배경 사진, widget: image, required: false, default: "" }
          - name: tide
            label: 물때 내비(우측 하단)
            widget: object
            fields:
              - { name: enabled, label: 화면에 표시, widget: boolean, default: true }
              - { name: label, label: 버튼 글자, widget: string, default: "물때" }
              - { name: title, label: 패널 제목, widget: string, default: "장도 입도 가능 시간" }
              - { name: svg_url, label: 시간표 이미지 주소, widget: string }
              - { name: more_url, label: "\"다른 날짜\" 링크 주소", widget: string }
              - { name: note, label: 하단 안내 문구, widget: text }
          - name: footer
            label: 푸터
            widget: object
            fields:
              - { name: org_line, label: 한 줄 소개, widget: string }
              - { name: copyright, label: 저작권 문구, widget: string }
              - { name: instagram, label: 인스타그램 URL, widget: string, required: false, default: "" }
              - { name: youtube, label: 유튜브 URL, widget: string, required: false, default: "" }
      - name: program_timeline
        label: 연례 프로그램 타임라인
        file: "_data/program.yml"
        fields:
          - { name: note, label: 상단 설명 한 줄, widget: string }
          - name: years
            label: 연도별 항목
            widget: list
            fields:
              - { name: year, label: 연도, widget: number, value_type: int }
              - { name: cohort, label: 기수, widget: number, value_type: int }
              - name: events
                label: 행사·프로그램
                widget: list
                summary: "{{fields.label}} — {{fields.from}}–{{fields.to}}월"
                fields:
                  - { name: label, label: 이름, widget: select, options: ["입주", "프리뷰전", "오픈스튜디오", "지역연계", "작가와의 대화", "평론가 매칭", "입주작가전", "창작스튜디오 개소"], hint: "항상 같은 이름만 씁니다 — 개별 전시 제목·장소는 넣지 마세요 (칸을 넘쳐 잘립니다)" }
                  - { name: from, label: 시작 월 (1–12), widget: number, value_type: int, min: 1, max: 12, required: false, hint: "비워두면 '월 미상'으로 트랙 아래 칩에 표시됩니다" }
                  - { name: to, label: 끝 월 (1–12), widget: number, value_type: int, min: 1, max: 12, required: false, hint: "한 달짜리면 비워두세요 — 선 대신 점으로 표시됩니다" }
                  - { name: url, label: 클릭 시 이동할 주소, widget: string, required: false, default: "", hint: "예: /projects/2025-05-open-studio-6/ 또는 https://..." }
                  - name: artists
                    label: 작가별 기간
                    widget: list
                    required: false
                    default: []
                    summary: "{{fields.name}} — {{fields.from}}–{{fields.to}}월"
                    hint: "입주작가전처럼 작가마다 기간이 다를 때. 바로 아래 얇은 줄로 붙습니다"
                    fields:
                      - { name: name, label: 작가·전시 이름, widget: string }
                      - { name: from, label: 시작 월, widget: number, value_type: int, min: 1, max: 12 }
                      - { name: to, label: 끝 월, widget: number, value_type: int, min: 1, max: 12, required: false }
                      - { name: url, label: 주소, widget: string, required: false, default: "" }

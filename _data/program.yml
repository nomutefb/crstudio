# ─────────────────────────────────────────────
# 연례 프로그램 타임라인 — /admin → 사이트 설정 → 연례 프로그램에서 수정
#
# label   : 항상 같은 이름만 쓴다 (입주 / 프리뷰전 / 오픈스튜디오 / 지역연계 / 입주작가전)
#           개별 전시 제목이나 장소는 넣지 않는다 — 칸을 넘쳐 잘린다
# from/to : 월(1–12). from이 없으면 월 미상 → 트랙 아래 칩으로 표시
# url     : 누르면 이동할 주소 (사이트 내부 경로 또는 외부 링크)
# artists : 입주작가전처럼 작가마다 기간이 다른 경우, 바로 아래 얇은 줄로 붙는다
# ─────────────────────────────────────────────

note: "공모 → 입주(OT·프리뷰) → 오픈스튜디오 → 지역연계 프로그램 → 평론가 매칭 → 입주작가전으로 이어지는 연간 사이클"


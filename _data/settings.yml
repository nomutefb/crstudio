facility: "예술의 섬 장도 — 편의동 1동(안내센터 25㎡ · 작가숙소 3실 각 33㎡ · 커뮤니티룸 43㎡) + 창작스튜디오 4동(각 68㎡) · 전남 여수시 예울마루로 100"

program:
  - title: "RESIDENCY · 입주 프로그램"
    desc: "기수별 공모로 선정된 작가들이 일정 기간 스튜디오에 입주해 신작을 제작합니다."
  - title: "SUPPORT · 창작 지원"
    desc: "작업 공간과 체류 환경, 제작 실비와 전문가 매칭 등 창작에 필요한 조건을 지원합니다."
  - title: "EXHIBITION · 전시 연계"
    desc: "입주 기간의 결과물은 성과전과 기획전, 오픈 스튜디오를 통해 관객과 만납니다."
  - title: "COMMUNITY · 교류"
    desc: "시민 참여 프로그램과 워크숍으로 작가와 지역이 서로의 일상에 스며듭니다."


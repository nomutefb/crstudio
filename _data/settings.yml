hero:
  kicker: "CHANGJAK STUDIO · JANGDO, YEOSU"
  line1: "CREATIVE"
  line2: "STUDIO"
  tagline: "섬에 머무는 작가들, 기수로 이어지는 작업의 기록."
  marquee: "RESIDENCY ARCHIVE — JANGDO · YEOSU — SINCE 2020 — COHORT 01–07"

intro:
  label: "ABOUT — 소개"
  heading: "작가가 머무는 시간을 기록합니다"
  paragraphs:
    - "여수 장도의 창작스튜디오는 국내외 예술가들에게 안정적인 창작 환경을 제공하는 레지던시입니다. 섬에 있던 다섯 가구의 집터에 건물을 새로 지어 마련했고, 조수간만의 차에 따라 섬과 육지가 이어졌다 끊기는 장도만의 환경 속에 놓여 있습니다."
    - "해마다 새로운 기수의 작가들이 섬에 머물며 작업하고, 문화예술 전문가와의 교류와 시민과의 대화를 통해 새로운 창작 의지를 얻습니다. 이 사이트는 그 시간이 흩어지지 않도록, 작가를 가장 앞에 두고 기록하는 아카이브입니다."

